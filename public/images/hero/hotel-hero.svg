<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hotel Hero Background</title>
  <desc id="desc">Illustration of a luxury hotel at sunset for hero section background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="38%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.36" />
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)" />
  <rect width="1920" height="1080" fill="url(#sunGlow)" />

  <g opacity="0.42">
    <path d="M0 700 L300 640 L560 710 L860 650 L1190 720 L1520 660 L1920 740 L1920 1080 L0 1080 Z" fill="#0f172a" />
    <path d="M0 760 L350 700 L720 770 L1130 710 L1500 790 L1920 730 L1920 1080 L0 1080 Z" fill="#111827" />
  </g>

  <g transform="translate(430 240)">
    <rect x="0" y="0" width="1060" height="520" rx="20" fill="url(#facade)" />
    <rect x="120" y="-65" width="820" height="90" rx="16" fill="#0b1220" />
    <rect x="490" y="35" width="80" height="455" fill="#111827" />

    <g fill="url(#glass)">
      <rect x="65" y="80" width="170" height="100" rx="8" />
      <rect x="255" y="80" width="170" height="100" rx="8" />
      <rect x="635" y="80" width="170" height="100" rx="8" />
      <rect x="825" y="80" width="170" height="100" rx="8" />

      <rect x="65" y="205" width="170" height="100" rx="8" />
      <rect x="255" y="205" width="170" height="100" rx="8" />
      <rect x="635" y="205" width="170" height="100" rx="8" />
      <rect x="825" y="205" width="170" height="100" rx="8" />

      <rect x="65" y="330" width="170" height="100" rx="8" />
      <rect x="255" y="330" width="170" height="100" rx="8" />
      <rect x="635" y="330" width="170" height="100" rx="8" />
      <rect x="825" y="330" width="170" height="100" rx="8" />
    </g>

    <rect x="430" y="300" width="200" height="220" rx="12" fill="#111827" />
    <rect x="455" y="328" width="150" height="164" rx="8" fill="#0f172a" />
    <rect x="486" y="350" width="88" height="120" rx="4" fill="#1e293b" />

    <g fill="#f59e0b" opacity="0.65">
      <rect x="95" y="108" width="110" height="45" rx="4" />
      <rect x="285" y="233" width="110" height="45" rx="4" />
      <rect x="855" y="358" width="110" height="45" rx="4" />
      <rect x="665" y="108" width="110" height="45" rx="4" />
    </g>
  </g>

  <g opacity="0.55">
    <ellipse cx="960" cy="815" rx="700" ry="70" fill="#0b1220" />
    <path d="M260 900 C570 850, 1300 850, 1660 900 L1660 1080 L260 1080 Z" fill="#0b1220" />
  </g>
</svg>
